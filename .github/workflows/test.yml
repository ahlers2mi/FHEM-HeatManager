name: Test

on:
  push:
    paths:
      - 'FHEM/**'
      - 't/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keine github.com-URL im Modul
        run: |
          ! grep -n "github.com" FHEM/98_HeatManager.pm

      - name: Syntax und Funktionstests
        run: sh t/run.sh
